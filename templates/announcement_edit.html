{% extends "base.html" %}
{% block title %}تعديل الإعلان - إدارة المهام{% endblock %}
{% block content %}
    {% if not announcement %}
    <div class="error-card">
        <i class="fas fa-exclamation-triangle" style="font-size: 48px; color: var(--danger); margin-bottom: 20px;"></i>
        <h2>الإعلان غير موجود</h2>
        <p>الإعلان المطلوب غير موجود أو تم حذفه.</p>
        <a href="{{ url_for('announcements_page') }}" class="btn btn-primary">
            <i class="fas fa-list"></i> عرض الإعلانات
        </a>
    </div>
    {% else %}
    <div class="header">
        <h1><i class="fas fa-edit" style="color: var(--primary); margin-left: 10px;"></i> تعديل الإعلان</h1>
    </div>

    <div class="form-card">
        <h3><i class="fas fa-bullhorn"></i> بيانات الإعلان</h3>

        <form method="POST" action="{{ url_for('announcement_edit', aid=announcement.id) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label>العنوان</label>
                <input type="text" name="title" value="{{ announcement.title }}" required>
            </div>

            <div class="form-group">
                <label>المحتوى</label>
                <textarea name="content" rows="6" required>{{ announcement.content }}</textarea>
            </div>

            <div class="modal-actions">
                <button type="submit" class="btn btn-success">
                    <i class="fas fa-save"></i> حفظ التعديل
                </button>
                <a href="{{ url_for('announcements_page') }}" class="btn btn-danger">
                    <i class="fas fa-times"></i> إلغاء
                </a>
            </div>
        </form>
    </div>
    {% endif %}
{% endblock %}
